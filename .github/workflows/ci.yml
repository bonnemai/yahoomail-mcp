name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run tests with coverage
        run: python -m pytest --cov=yahoomail_mcp --cov-report=term-missing --cov-report=xml

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate SAM template
        run: sam validate --lint

      - name: Enable ARM64 container builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Lambda image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lambda
          platforms: linux/arm64
          tags: yahoomail-mcp:ci
          load: true

      - name: Package Lambda image
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker image inspect yahoomail-mcp:ci >/dev/null
          docker save yahoomail-mcp:ci | gzip > artifacts/yahoomail-mcp-arm64.tar.gz
          cp template.yaml artifacts/template.yaml
          test -s artifacts/yahoomail-mcp-arm64.tar.gz
          ls -lh artifacts

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

      - name: Upload Lambda package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: artifacts
          if-no-files-found: error
