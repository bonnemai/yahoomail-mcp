name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run tests with coverage
        run: python -m pytest --cov=yahoomail_mcp --cov-report=term-missing --cov-report=xml

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate SAM template
        run: sam validate --lint

      - name: Enable ARM64 container builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Pre-pull Lambda base images
        run: |
          docker pull --platform linux/arm64 python:3.13-slim
          docker pull --platform linux/arm64 public.ecr.aws/awsguru/aws-lambda-adapter:1.1.0

      - name: Build Lambda package
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        run: sam build --use-container

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

      - name: Upload SAM build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sam-build
          path: .aws-sam/build
          if-no-files-found: error
